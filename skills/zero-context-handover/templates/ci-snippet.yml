name: Handover Guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Handover consistency guard
        run: python check_handover.py
